# Spring Boot Configuration File
# This file contains application settings

# Server Configuration
# Port where the application will run (default: 8080)
server.port=8080

# Application Name
spring.application.name=SpringBoot-Camel-App

# Logging Configuration
# Set logging levels for different packages
logging.level.root=INFO
logging.level.com.example.camelapp=INFO
logging.level.org.apache.camel=INFO

# Camel Configuration
# Enable Camel auto-configuration
camel.springboot.main-run-controller=true

# Show Camel routes on startup
camel.springboot.routes-collector-enabled=true

# Banner Configuration
spring.banner.location=classpath:banner.txt
